name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skills
        run: python .claude/skills/job-seeker-helper/scripts/validate_skill.py .claude/skills
      - name: Run unit tests
        run: python -m unittest discover -s tests
